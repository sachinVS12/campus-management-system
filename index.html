<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Form</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: linear-gradient(to right, #4facfe, #00f2fe);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .container {
        background: #fff;
        width: 400px;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      }

      .container h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #333;
      }

      .form-group {
        margin-bottom: 15px;
      }

      label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
        color: #444;
      }

      input,
      select,
      textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        outline: none;
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: #4facfe;
      }

      button {
        width: 100%;
        padding: 12px;
        background: #4facfe;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
      }

      button:hover {
        background: #008cdd;
      }

      .message {
        margin-top: 15px;
        text-align: center;
        color: green;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>Campus Registration Form</h2>

      <form id="campusForm">
        <div class="form-group">
          <label>Student Name</label>
          <input type="text" id="name" required />
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" required />
        </div>

        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" id="phone" required />
        </div>

        <div class="form-group">
          <label>Department</label>
          <select id="department" required>
            <option value="">Select Department</option>
            <option>CSE</option>
            <option>ECE</option>
            <option>MECH</option>
            <option>CIVIL</option>
          </select>
        </div>

        <div class="form-group">
          <label>Address</label>
          <textarea id="address" rows="3"></textarea>
        </div>

        <button type="submit">Submit</button>
      </form>

      <div class="message" id="message"></div>
    </div>

    <script>
      const form = document.getElementById("campusForm");
      const message = document.getElementById("message");

      form.addEventListener("submit", function (event) {
        event.preventDefault();

        const name = document.getElementById("name").value;

        message.innerHTML = "Form submitted successfully! Welcome " + name;

        form.reset();
      });
    </script>
  </body>
</html>
