<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Registration</title>

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #141e30, #243b55);
        overflow: hidden;
      }

      /* Animated Circles */
      body::before,
      body::after {
        content: "";
        position: absolute;
        width: 300px;
        height: 300px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.08);
        animation: float 8s infinite alternate;
      }

      body::before {
        top: -80px;
        left: -80px;
      }

      body::after {
        bottom: -100px;
        right: -80px;
      }

      @keyframes float {
        from {
          transform: translateY(0px);
        }
        to {
          transform: translateY(30px);
        }
      }

      .container {
        position: relative;
        width: 420px;
        padding: 35px;
        border-radius: 20px;
        backdrop-filter: blur(15px);
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        color: #fff;
        animation: fadeIn 1s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .container h2 {
        text-align: center;
        margin-bottom: 25px;
        font-size: 30px;
        font-weight: 600;
        letter-spacing: 1px;
        color: #fff;
      }

      .input-box {
        margin-bottom: 18px;
      }

      .input-box label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        color: #ddd;
      }

      .input-box input,
      .input-box select,
      .input-box textarea {
        width: 100%;
        padding: 13px;
        border: none;
        outline: none;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
        font-size: 15px;
        transition: 0.3s;
      }

      .input-box input::placeholder,
      .input-box textarea::placeholder {
        color: #ccc;
      }

      .input-box input:focus,
      .input-box select:focus,
      .input-box textarea:focus {
        background: rgba(255, 255, 255, 0.25);
        box-shadow: 0 0 10px #00d4ff;
      }

      select option {
        color: #000;
      }

      .gender {
        display: flex;
        gap: 20px;
        margin-top: 10px;
        color: #ddd;
      }

      .gender input {
        margin-right: 5px;
      }

      .btn {
        width: 100%;
        padding: 14px;
        margin-top: 10px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(90deg, #00d2ff, #3a7bd5);
        color: white;
        font-size: 17px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.4s;
      }

      .btn:hover {
        transform: scale(1.03);
        box-shadow: 0 0 20px rgba(0, 210, 255, 0.7);
      }

      .message {
        text-align: center;
        margin-top: 20px;
        font-size: 16px;
        color: #00ffae;
        font-weight: 500;
      }

      .icon {
        text-align: center;
        font-size: 55px;
        margin-bottom: 10px;
      }

      @media (max-width: 500px) {
        .container {
          width: 90%;
          padding: 25px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="icon">🎓</div>

      <h2>Campus Registration</h2>

      <form id="campusForm">
        <div class="input-box">
          <label>Full Name</label>
          <input type="text" id="name" placeholder="Enter your name" required />
        </div>

        <div class="input-box">
          <label>Email Address</label>
          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
          />
        </div>

        <div class="input-box">
          <label>Phone Number</label>
          <input
            type="tel"
            id="phone"
            placeholder="Enter your phone number"
            required
          />
        </div>

        <div class="input-box">
          <label>Department</label>
          <select id="department" required>
            <option value="">Select Department</option>
            <option>Computer Science</option>
            <option>Electronics</option>
            <option>Mechanical</option>
            <option>Civil</option>
            <option>Business Administration</option>
          </select>
        </div>

        <div class="input-box">
          <label>Gender</label>
          <div class="gender">
            <label><input type="radio" name="gender" /> Male</label>
            <label><input type="radio" name="gender" /> Female</label>
            <label><input type="radio" name="gender" /> Other</label>
          </div>
        </div>

        <div class="input-box">
          <label>Address</label>
          <textarea rows="3" placeholder="Enter your address"></textarea>
        </div>

        <button type="submit" class="btn">Register Now</button>
      </form>

      <div class="message" id="message"></div>
    </div>

    <script>
      const form = document.getElementById("campusForm");
      const message = document.getElementById("message");

      form.addEventListener("submit", function (e) {
        e.preventDefault();

        const name = document.getElementById("name").value;

        message.innerHTML = "✅ Registration Successful, " + name + "!";

        setTimeout(() => {
          message.innerHTML = "";
        }, 4000);

        form.reset();
      });
    </script>
  </body>
</html>
