<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Colorful Campus Form</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px;
        background: linear-gradient(135deg, #141e30, #243b55);
      }

      .container {
        width: 900px;
        padding: 40px;
        border-radius: 25px;
        background: white;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        animation: fadeIn 1s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      h1 {
        text-align: center;
        margin-bottom: 10px;
        color: #222;
        font-size: 36px;
      }

      .subtitle {
        text-align: center;
        margin-bottom: 35px;
        color: #666;
      }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }

      .input-box {
        display: flex;
        flex-direction: column;
      }

      .input-box label {
        margin-bottom: 8px;
        font-weight: 600;
        color: #333;
      }

      .input-box input,
      .input-box select,
      .input-box textarea {
        padding: 14px;
        border: none;
        border-radius: 14px;
        font-size: 15px;
        color: #222;
        outline: none;
        transition: 0.3s;
        font-weight: 500;
      }

      .input-box input:focus,
      .input-box select:focus,
      .input-box textarea:focus {
        transform: scale(1.02);
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
      }

      /* Different Colors */

      .name {
        background: #ffe0e6;
      }

      .email {
        background: #e0f7fa;
      }

      .phone {
        background: #fff3cd;
      }

      .dob {
        background: #ede7f6;
      }

      .tenth {
        background: #d4edda;
      }

      .puc {
        background: #f8d7da;
      }

      .degree {
        background: #d1ecf1;
      }

      .course {
        background: #fff0b3;
      }

      .department {
        background: #f3d9fa;
      }

      .year {
        background: #c8e6c9;
      }

      .skills {
        background: #ffe5b4;
      }

      .address {
        background: #d6eaff;
      }

      .gender-box {
        background: #f1f1f1;
        padding: 15px;
        border-radius: 14px;
      }

      .gender {
        display: flex;
        gap: 20px;
        margin-top: 10px;
      }

      .full-width {
        grid-column: 1 / 3;
      }

      .btn {
        width: 100%;
        padding: 16px;
        margin-top: 25px;
        border: none;
        border-radius: 15px;
        background: linear-gradient(90deg, #ff512f, #dd2476);
        color: white;
        font-size: 18px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s;
      }

      .btn:hover {
        transform: scale(1.03);
        box-shadow: 0 0 20px rgba(221, 36, 118, 0.5);
      }

      .message {
        text-align: center;
        margin-top: 20px;
        font-size: 18px;
        color: green;
        font-weight: 600;
      }

      @media (max-width: 768px) {
        .form-grid {
          grid-template-columns: 1fr;
        }

        .full-width {
          grid-column: auto;
        }

        .container {
          width: 100%;
          padding: 25px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>🎓 Campus Registration Form</h1>
      <p class="subtitle">Fill your personal and academic details</p>

      <form id="campusForm">
        <div class="form-grid">
          <div class="input-box">
            <label>Full Name</label>
            <input
              type="text"
              id="name"
              class="name"
              placeholder="Enter your name"
              required
            />
          </div>

          <div class="input-box">
            <label>Email Address</label>
            <input
              type="email"
              class="email"
              placeholder="Enter your email"
              required
            />
          </div>

          <div class="input-box">
            <label>Phone Number</label>
            <input
              type="tel"
              class="phone"
              placeholder="Enter phone number"
              required
            />
          </div>

          <div class="input-box">
            <label>Date of Birth</label>
            <input type="date" class="dob" required />
          </div>

          <div class="input-box full-width gender-box">
            <label>Gender</label>

            <div class="gender">
              <label><input type="radio" name="gender" /> Male</label>
              <label><input type="radio" name="gender" /> Female</label>
              <label><input type="radio" name="gender" /> Other</label>
            </div>
          </div>

          <div class="input-box">
            <label>10th Percentage</label>
            <input
              type="number"
              class="tenth"
              placeholder="Enter 10th %"
              required
            />
          </div>

          <div class="input-box">
            <label>PUC / 12th Percentage</label>
            <input
              type="number"
              class="puc"
              placeholder="Enter PUC %"
              required
            />
          </div>

          <div class="input-box">
            <label>Degree Percentage / CGPA</label>
            <input
              type="text"
              class="degree"
              placeholder="Enter Degree %"
              required
            />
          </div>

          <div class="input-box">
            <label>Current Course</label>
            <select class="course" required>
              <option value="">Select Course</option>
              <option>BCA</option>
              <option>BSc</option>
              <option>BCom</option>
              <option>BE</option>
              <option>BTech</option>
              <option>MCA</option>
              <option>MBA</option>
            </select>
          </div>

          <div class="input-box">
            <label>Department</label>
            <select class="department" required>
              <option value="">Select Department</option>
              <option>Computer Science</option>
              <option>Electronics</option>
              <option>Mechanical</option>
              <option>Civil</option>
              <option>Business Administration</option>
            </select>
          </div>

          <div class="input-box">
            <label>Year of Passing</label>
            <input
              type="number"
              class="year"
              placeholder="Passing year"
              required
            />
          </div>

          <div class="input-box full-width">
            <label>Skills</label>
            <input
              type="text"
              class="skills"
              placeholder="HTML, CSS, JavaScript, Python"
            />
          </div>

          <div class="input-box full-width">
            <label>Address</label>
            <textarea
              rows="4"
              class="address"
              placeholder="Enter your address"
            ></textarea>
          </div>
        </div>

        <button type="submit" class="btn">Submit Registration</button>
      </form>

      <div class="message" id="message"></div>
    </div>

    <script>
      const form = document.getElementById("campusForm");
      const message = document.getElementById("message");

      form.addEventListener("submit", function (e) {
        e.preventDefault();

        const name = document.getElementById("name").value;

        message.innerHTML = "✅ Registration Successful, " + name + "!";

        setTimeout(() => {
          message.innerHTML = "";
        }, 5000);

        form.reset();
      });
    </script>
  </body>
</html>
