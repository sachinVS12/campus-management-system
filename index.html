<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Registration Form</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        padding: 30px;
      }

      .container {
        width: 850px;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 20px;
        padding: 40px;
        color: white;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        animation: fadeIn 1s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      h1 {
        text-align: center;
        margin-bottom: 10px;
        font-size: 34px;
      }

      .subtitle {
        text-align: center;
        margin-bottom: 30px;
        color: #ddd;
      }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }

      .input-box {
        display: flex;
        flex-direction: column;
      }

      .input-box label {
        margin-bottom: 8px;
        font-size: 14px;
        color: #ddd;
      }

      .input-box input,
      .input-box select,
      .input-box textarea {
        padding: 13px;
        border: none;
        outline: none;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.15);
        color: white;
        font-size: 15px;
        transition: 0.3s;
      }

      .input-box input::placeholder,
      .input-box textarea::placeholder {
        color: #ccc;
      }

      .input-box input:focus,
      .input-box select:focus,
      .input-box textarea:focus {
        background: rgba(255, 255, 255, 0.25);
        box-shadow: 0 0 10px #00d4ff;
      }

      select option {
        color: black;
      }

      .full-width {
        grid-column: 1 / 3;
      }

      .gender {
        display: flex;
        gap: 20px;
        margin-top: 10px;
      }

      .gender label {
        color: #eee;
      }

      .btn {
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 14px;
        background: linear-gradient(90deg, #00c6ff, #0072ff);
        color: white;
        font-size: 17px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 20px;
        transition: 0.3s;
      }

      .btn:hover {
        transform: scale(1.02);
        box-shadow: 0 0 20px rgba(0, 198, 255, 0.6);
      }

      .message {
        text-align: center;
        margin-top: 20px;
        color: #00ffbf;
        font-size: 18px;
        font-weight: 500;
      }

      @media (max-width: 768px) {
        .form-grid {
          grid-template-columns: 1fr;
        }

        .full-width {
          grid-column: auto;
        }

        .container {
          padding: 25px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>🎓 Campus Registration</h1>
      <p class="subtitle">Fill in your academic and personal details</p>

      <form id="campusForm">
        <div class="form-grid">
          <!-- Personal Details -->

          <div class="input-box">
            <label>Full Name</label>
            <input
              type="text"
              id="name"
              placeholder="Enter your full name"
              required
            />
          </div>

          <div class="input-box">
            <label>Email Address</label>
            <input type="email" placeholder="Enter your email" required />
          </div>

          <div class="input-box">
            <label>Phone Number</label>
            <input type="tel" placeholder="Enter phone number" required />
          </div>

          <div class="input-box">
            <label>Date of Birth</label>
            <input type="date" required />
          </div>

          <div class="input-box full-width">
            <label>Gender</label>

            <div class="gender">
              <label><input type="radio" name="gender" /> Male</label>
              <label><input type="radio" name="gender" /> Female</label>
              <label><input type="radio" name="gender" /> Other</label>
            </div>
          </div>

          <!-- Academic Details -->

          <div class="input-box">
            <label>10th Percentage</label>
            <input type="number" placeholder="Enter 10th %" required />
          </div>

          <div class="input-box">
            <label>PUC / 12th Percentage</label>
            <input type="number" placeholder="Enter PUC / 12th %" required />
          </div>

          <div class="input-box">
            <label>Degree Percentage / CGPA</label>
            <input type="text" placeholder="Enter Degree %" required />
          </div>

          <div class="input-box">
            <label>Current Course</label>
            <select required>
              <option value="">Select Course</option>
              <option>BCA</option>
              <option>BSc</option>
              <option>BCom</option>
              <option>BE</option>
              <option>BTech</option>
              <option>MCA</option>
              <option>MBA</option>
            </select>
          </div>

          <div class="input-box">
            <label>Department</label>
            <select required>
              <option value="">Select Department</option>
              <option>Computer Science</option>
              <option>Electronics</option>
              <option>Mechanical</option>
              <option>Civil</option>
              <option>Business Administration</option>
            </select>
          </div>

          <div class="input-box">
            <label>Year of Passing</label>
            <input type="number" placeholder="Enter passing year" required />
          </div>

          <div class="input-box full-width">
            <label>Skills</label>
            <input type="text" placeholder="HTML, CSS, JavaScript, Python..." />
          </div>

          <div class="input-box full-width">
            <label>Address</label>
            <textarea rows="4" placeholder="Enter your address"></textarea>
          </div>
        </div>

        <button type="submit" class="btn">Submit Registration</button>
      </form>

      <div class="message" id="message"></div>
    </div>

    <script>
      const form = document.getElementById("campusForm");
      const message = document.getElementById("message");

      form.addEventListener("submit", function (e) {
        e.preventDefault();

        const name = document.getElementById("name").value;

        message.innerHTML =
          "✅ Registration Submitted Successfully, " + name + "!";

        setTimeout(() => {
          message.innerHTML = "";
        }, 5000);

        form.reset();
      });
    </script>
  </body>
</html>
